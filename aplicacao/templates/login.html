{% extends 'base.html' %}
{% block conteudo %}
<div class="card" style="max-width:420px;margin:60px auto;">
  <h2>Entrar no sistema</h2>
  <form method="post">
    <div class="campo">
      <label>Login</label>
      <input name="login" required style="width:100%">
    </div>
    <div class="campo">
      <label>Senha</label>
      <input name="senha" type="password" required style="width:100%">
    </div>
    <button type="submit" style="width:100%">Entrar</button>
  </form>
</div>
{% endblock %}
